server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # DNS embebido de Docker: permite re-resolver "backend" si el contenedor reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy hacia backend API
    # ^~ evita que nginx evalúe locations regex para /api/
    # proxy_pass solo con URL base en variable: reenvía la URI completa (/api/...).
    # (proxy_pass http://$host:puerto/ruta/ rompe la sustitución de URI con variables.)
    location ^~ /api/ {
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Archivos subidos (evidencias) servidos por el backend.
    location ^~ /uploads/ {
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Cache agresivo para assets estáticos del SPA
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
